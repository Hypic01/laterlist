<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laterlist</title>
  <meta name="description" content="A private Laterlist. Sign in to open your Watch Later." />
  <meta property="og:title" content="Laterlist" />
  <meta property="og:description" content="A private Laterlist." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Stamp the saved theme before first paint so light mode never flashes dark; mark JS on for reveal-on-scroll. -->
  <script>document.documentElement.classList.add('has-js');try{if(localStorage.getItem('laterlist:theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
  <meta name="theme-color" content="#191919" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191919'/%3E%3Cg fill='none' stroke='%23D9D9D9' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(4 4)'%3E%3Cpath d='M4 6h10M4 12h10M4 18h6'/%3E%3Cpath d='M15 15l3 3 4-5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ---- Tokens: mirrors web/src/styles.css so the site and the app are one system.
           Monochrome base (Woodsmoke/Gainsboro) that swaps on the theme toggle;
           colour lives only on the category shelves. ---- */
    :root{
      color-scheme:dark;
      --background:#191919; --foreground:#D9D9D9;
      --card:#212121; --popover:#292929; --secondary:#2E2E2E;
      --accent:var(--foreground);
      --primary:var(--accent); --primary-hover:color-mix(in srgb,var(--foreground) 82%,var(--background)); --primary-foreground:var(--background);
      --muted:#9A9A9A; --faint:#6E6E6E;
      --border:rgba(217,217,217,.10); --border-strong:rgba(217,217,217,.18);
      --success:var(--foreground);
      --cat-learn:#6695F7; --cat-watch:#70B665; --cat-music:#FFBAC3;
      --cat-fun:#FFDE66; --cat-outdated:#EC614B;
      --w-full:1120px; --w-prose:780px;
      --display:'Fjalla One',-apple-system,sans-serif;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
      --r-sm:4px; --r-md:7px; --r-lg:11px;
      --ease:cubic-bezier(.2,.7,.3,1);
    }
    :root[data-theme="light"]{
      color-scheme:light;
      --background:#D9D9D9; --foreground:#191919;
      --card:#EDEDED; --popover:#F4F4F4; --secondary:#E4E4E4;
      --muted:#5A5A5A; --faint:#7C7C7C;
      --border:rgba(25,25,25,.14); --border-strong:rgba(25,25,25,.24);
    }
    *{box-sizing:border-box;margin:0}
    html{scroll-behavior:smooth}
    body{background:var(--background);color:var(--foreground);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .wrap{max-width:var(--w-full);margin:0 auto;padding:0 28px}
    :focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:var(--r-sm)}

    /* ---- Nav ---- */
    nav{display:flex;align-items:center;gap:18px;padding:24px 0;border-bottom:1px solid var(--border)}
    .seal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
      color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 42%,transparent);
      background:color-mix(in srgb,var(--primary) 9%,transparent)}
    nav b{font-family:var(--display);font-size:19px;font-weight:500;letter-spacing:.004em;white-space:nowrap}
    /* The full wordmark is long. Tighten the row rather than drop the brand name:
       at 375px this leaves ~30px of slack instead of overflowing by 31px. */
    @media(max-width:480px){
      nav{gap:10px;padding:18px 0}
      nav b{font-size:15px}
      nav .btn{padding:9px 13px;font-size:13px}
      .seal{width:30px;height:30px}
    }
    nav .sp{flex:1}
    .yt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
      border:1px solid var(--border);border-radius:999px;padding:3px 8px;white-space:nowrap}
    @media(max-width:560px){.yt{display:none}}
    .theme-toggle{width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--border);
      border-radius:999px;background:var(--secondary);color:var(--muted);cursor:pointer;
      transition:color 180ms var(--ease),border-color 180ms var(--ease)}
    .theme-toggle:hover{color:var(--foreground);border-color:var(--border-strong)}

    .btn{display:inline-flex;align-items:center;gap:9px;border:1px solid transparent;border-radius:var(--r-md);
      padding:11px 20px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;cursor:pointer;
      transition:background 200ms var(--ease),border-color 200ms var(--ease),box-shadow 200ms var(--ease),transform 120ms var(--ease)}
    .btn:active{transform:scale(.98)}
    .btn-primary{background:var(--primary);color:var(--primary-foreground);font-weight:600}
    .btn-primary:hover{background:var(--primary-hover);box-shadow:0 4px 18px rgba(0,0,0,.28)}
    .btn-ghost{background:var(--secondary);border-color:var(--border);color:var(--foreground)}
    .btn-ghost:hover{background:var(--popover);border-color:var(--border-strong)}

    /* ---- Hero ---- */
    .hero{padding:118px 0 40px;text-align:center}
    .hero h1{font-family:var(--display);font-size:clamp(40px,7.4vw,76px);line-height:1.02;letter-spacing:-.01em;max-width:17ch;margin:0 auto}
    .cta{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

    footer{margin-top:108px;border-top:1px solid var(--border);padding:30px 0 60px;display:flex;gap:22px;flex-wrap:wrap;align-items:center;color:var(--faint);font-size:13.5px}
    footer a{color:var(--muted);text-decoration:none}
    footer a:hover{color:var(--foreground)}
    footer .sp{flex:1}

    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <span class="seal" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h10M4 18h6"/><path d="M15 15l3 3 4-5"/></svg>
      </span>
      <b>laterlist</b>
      <span class="yt">for YouTube</span>
      <span class="sp"></span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme"></button>
      <a class="btn btn-ghost" href="/app?signin=1">Sign in</a>
    </nav>

    <header class="hero">
      <h1>Your private Laterlist.</h1>
      <div class="cta">
        <a class="btn btn-primary" href="/app?signin=1">Sign in</a>
      </div>
    </header>

    <footer>
      <span>Laterlist</span>
      <span class="sp"></span>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
      <a href="/app?signin=1">Sign in</a>
    </footer>
  </div>
  <script>
    (function(){
      var KEY='laterlist:theme';
      var sun='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      var moon='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var meta=document.querySelector('meta[name="theme-color"]');
      var btn=document.getElementById('themeToggle');
      function isLight(){return document.documentElement.dataset.theme==='light';}
      function render(){ if(!btn) return; btn.innerHTML=isLight()?moon:sun; if(meta) meta.setAttribute('content', isLight()?'#D9D9D9':'#191919'); }
      if(btn){ btn.addEventListener('click',function(){
        var light=!isLight();
        if(light){document.documentElement.dataset.theme='light';} else {delete document.documentElement.dataset.theme;}
        try{localStorage.setItem(KEY, light?'light':'dark');}catch(e){}
        render();
      }); }
      render();

    })();
  </script>
</body>
</html>
